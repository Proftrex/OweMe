<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OweMe</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/owelogo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <!-- AUTH -->
    <section id="authView" class="screen hidden">

      <div class="auth-card">

        <div class="brand">
          <div class="brand-icon">÷</div>
          <h1>OweMe</h1>
          <p>Record what you paid. We'll do the math.</p>
        </div>

        <!-- LOGIN -->
        <div id="loginPanel">

          <h2>Welcome back</h2>

          <form id="loginForm">

            <label>
              Username or email
              <input
                id="loginIdentifier"
                type="text"
                autocomplete="username"
                required
                placeholder="@anna23 or anna@email.com"
              >
            </label>

            <label>
              Password
              <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                required
              >
            </label>

            <p style="text-align:right;margin-top:-8px;margin-bottom:14px;">
              <button
                type="button"
                class="link-button"
                id="forgotPasswordButton"
              >
                Forgot password?
              </button>
            </p>

            <button class="primary-button" type="submit">
              Log In
            </button>

          </form>

          <p class="switch-text">
            Don't have an account?
            <button class="link-button" id="showRegister">
              Create one
            </button>
          </p>

        </div>

        <!-- RESET PASSWORD -->
        <div id="resetPasswordPanel" class="hidden">

          <h2>Set a new password</h2>

          <p class="muted">
            Enter your new password below.
          </p>

          <form id="resetPasswordForm">

            <label>
              New password
              <input
                id="resetPassword"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                placeholder="At least 8 characters"
              >
            </label>

            <label>
              Confirm new password
              <input
                id="resetPasswordConfirm"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
              >
            </label>

            <button
              class="primary-button"
              type="submit"
            >
              Update Password
            </button>

          </form>

          <p class="switch-text">
            Remembered your password?
            <button
              type="button"
              class="link-button"
              id="backToLoginFromReset"
            >
              Back to Log In
            </button>
          </p>

        </div>


        <!-- REGISTER -->
        <div id="registerPanel" class="hidden">

          <h2>Create account</h2>

          <form id="registerForm">

            <label>
              Email
              <input
                id="registerEmail"
                type="email"
                autocomplete="email"
                required
                placeholder="anna@email.com"
              >
            </label>

            <label>
              Username
              <div class="username-input">
                <input
                  id="registerUsername"
                  type="text"
                  autocomplete="username"
                  required
                  maxlength="30"
                  placeholder="anna23"
                >
              </div>
            </label>
            <label>
              Display name
              <input
                id="registerDisplayName"
                type="text"
                required
                maxlength="50"
                placeholder="Anna"
              >
            </label>

            <label>
              Password
              <input
                id="registerPassword"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                placeholder="At least 8 characters"
              >
            </label>

            <label>
              Confirm password
              <input
                id="registerPasswordConfirm"
                type="password"
                autocomplete="new-password"
                required
              >
            </label>
            
            <button class="primary-button" type="submit">
              Create Account
            </button>

          </form>

          <p class="switch-text">
            Already have an account?
            <button class="link-button" id="showLogin">
              Log in
            </button>
          </p>

        </div>

      </div>

    </section>


    <!-- MAIN APP -->
    <section id="mainApp" class="hidden">

      <header class="topbar">

        <div class="brand-header">
          <img
            src="assets/owelogo.png"
            alt="OweMe"
            class="brand-logo"
          >
          <div class="app-name">OweMe</div>
          <div id="pageTitle" class="page-title">Home</div>
        </div>

        <div class="topbar-actions">

          <button
            id="refreshButton"
            class="header-action-button"
            type="button"
            aria-label="Refresh"
            title="Refresh"
          >
            <span aria-hidden="true">↻</span>
          </button>

          <button
            id="notificationButton"
            class="notification-button"
            type="button"
            aria-label="Notifications"
            onclick="openNotifications()"
          >
            <span class="notification-bell" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                <path d="M10 21h4"/>
              </svg>
            </span>
            <span
              id="notificationBadge"
              class="notification-badge hidden"
            >0</span>
          </button>

        </div>

      </header>


      <main id="content"></main>


      <nav class="bottom-nav">

        <button type="button" data-page="home" class="nav-item active" onclick="navigate('home')">
          <span><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5 9.5V21h14V9.5"/>
            <path d="M9.5 21v-6h5v6"/>
          </svg></span>
          <small>Home</small>
        </button>

        <button type="button" data-page="groups" class="nav-item" onclick="navigate('groups')">
          <span><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="8" r="3"/>
            <circle cx="17" cy="9" r="2.5"/>
            <path d="M3.5 20c.5-3.5 2.5-5.5 5.5-5.5s5 2 5.5 5.5"/>
            <path d="M14.5 14.5c2.8-.2 4.8 1.5 5.5 4.5"/>
          </svg></span>
          <small>Groups</small>
        </button>

        <button type="button" data-page="contacts" class="nav-item" onclick="navigate('contacts')">
          <span><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2"/>
            <path d="M9 3v2h6V3"/>
            <path d="M8.5 10h7"/>
            <path d="M8.5 14h7"/>
            <path d="M8.5 18h4"/>
          </svg></span>
          <small>Contacts</small>
        </button>

        <button type="button" data-page="invites" class="nav-item" onclick="navigate('invites')">
          <span><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 7 9-7"/>
          </svg></span>
          <small>Invites</small>
        </button>

        <button type="button" data-page="history" class="nav-item" onclick="navigate('history')">
          <span><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 7v5l3.5 2"/>
          </svg></span>
          <small>History</small>
        </button>

        <button type="button" data-page="profile" class="nav-item" onclick="navigate('profile')">
          <span><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5 21c.7-4.2 3-6.5 7-6.5s6.3 2.3 7 6.5"/>
          </svg></span>
          <small>Profile</small>
        </button>

      </nav>

    </section>


    <!-- MODAL -->
    <div id="modal" class="modal hidden">

      <div class="modal-backdrop"></div>

      <div class="modal-card">

        <button id="closeModal" class="modal-close">
          ×
        </button>

        <div id="modalContent"></div>

      </div>

    </div>


    <!-- TOAST -->
    <div id="toast" class="toast"></div>


    <!-- LOADING -->
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
      <span id="loadingText">Loading, please wait...</span>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=payme2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((error) => {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>

</body>
</html>
